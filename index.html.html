<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IELTS Writing Studio</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#1d2321;--mute:#58635e;--line:#e2e0d8;--acc:#0f766e;--on:#fff;--hl:#c9efe9;--warn:#b45309;--c2:#8a6d3b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111513;--card:#1a201e;--ink:#eef2f0;--mute:#a7b2ad;--line:#2b3431;--acc:#5eead4;--on:#042f2e;--hl:#134e48;--warn:#fbbf24;--c2:#e0b46a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111513;--card:#1a201e;--ink:#eef2f0;--mute:#a7b2ad;--line:#2b3431;--acc:#5eead4;--on:#042f2e;--hl:#134e48;--warn:#fbbf24;--c2:#e0b46a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background .3s,color .3s}
header{display:flex;justify-content:space-between;align-items:center;max-width:760px;margin:0 auto;padding:12px 20px}
.brand{font-weight:700;letter-spacing:.02em;color:var(--acc)}
main{max-width:760px;margin:0 auto;padding:8px 20px 56px}
main.in{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:clamp(1.7rem,5vw,2.3rem);line-height:1.2;margin:.4em 0 .3em}
h2{font-size:1.3rem;margin:0 0 .4em}h3{font-size:1.15rem;margin:0 0 .3em}
p{margin:.5em 0}
.lead,.mute,.count,.meta{color:var(--mute)}
.grid{display:grid;gap:16px;margin-top:24px}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;margin:16px 0}
.grid .card{margin:0}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:.95rem;margin:0 0 8px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;align-items:center}
.row.split{justify-content:space-between}
.btn,.chip,.back,.icon{font:inherit;font-weight:600;min-height:48px;min-width:48px;border-radius:14px;border:1.5px solid var(--acc);background:var(--acc);color:var(--on);padding:0 22px;cursor:pointer;transition:transform .15s,opacity .2s,background .2s}
.btn.ghost,.chip,.back,.icon{background:transparent;color:var(--acc)}
.btn:active,.chip:active{transform:scale(.97)}
.btn:disabled,.chip:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.chip:focus-visible,.back:focus-visible,.icon:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.back{border-color:transparent;padding:0 8px;margin-left:-8px}
.icon{padding:0}
.chips{display:flex;gap:10px;margin:12px 0}
.chip{padding:0}.chip.on{background:var(--acc);color:var(--on)}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .45s ease}
.ex{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px 22px;margin:16px 0}
.seg{transition:background .45s,opacity .45s;border-radius:6px;padding:2px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.ex.focus .seg{opacity:.35}
.ex .seg.on{opacity:1;background:var(--hl)}
.note{border-left:4px solid var(--acc);padding:4px 0 4px 18px;animation:in .35s ease}
.timer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 0 10px}
#clock{font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums}
#clock.warn,#warn{color:var(--warn)}#warn{font-weight:600}
textarea{display:block;width:100%;min-height:300px;font:inherit;padding:16px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);resize:vertical}
textarea:focus{outline:3px solid var(--acc);border-color:transparent}
summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600}
.drop{display:flex;align-items:center;min-height:56px;border:2px dashed var(--line);border-radius:14px;padding:8px 14px;margin-top:8px;color:var(--mute)}
.pv{max-width:100%;max-height:360px;border-radius:14px;margin-top:12px;display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center}
.stats b{display:block;font-size:1.6rem;color:var(--acc)}.stats span{font-size:.9rem;color:var(--mute)}
.banner{background:var(--hl);border-radius:14px;padding:12px 16px}
.skel i{display:block;height:12px;border-radius:6px;background:var(--line);margin:12px 0;animation:pulse 1.6s ease infinite}
.skel i:nth-child(2){width:80%}.skel i:nth-child(3){width:60%}
@keyframes pulse{50%{opacity:.4}}
.cmp{display:grid;gap:16px;margin-top:14px}
@media(min-width:700px){.cmp{grid-template-columns:1fr 1fr}}
.cmp div{white-space:pre-wrap;font-size:1rem;line-height:1.6}
.chart{margin:14px 0 0}.chart .cap{font-weight:600;font-size:.95rem}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--mute);font-size:11px}
.gl{stroke:var(--line)}
.s0{fill:var(--acc)}.s1{fill:var(--c2)}
.ln{fill:none;stroke-width:3}.ln.s0{stroke:var(--acc)}.ln.s1{stroke:var(--c2)}
.leg{display:flex;gap:16px;font-size:.9rem;color:var(--mute)}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<header><span class="brand">IELTS Writing</span><button class="icon" id="theme" aria-label="Toggle light or dark mode">&#9680;</button></header>
<main id="app"></main>
<script>
/* ============ CONTENT (add more tasks here) ============
   chart: {type:"bar"|"line", title, labels[], series:[{name,values[]}], max, step}
   lesson.example: paragraphs of [segmentId, text]; steps highlight segment ids (or "all"). */
const DATA = {
  task1: {
    name: "Task 1", mins: 20, min: 150,
    blurb: "Describe a chart or graph in at least 150 words.",
    lesson: {
      title: "Describe a chart",
      example: [
        [["s1", "The bar chart shows how many hours per week residents of one town spent exercising, by age group, in 2024."]],
        [["s2", "Overall, younger adults were the most active, while middle-aged residents exercised the least."]],
        [["s3", "The 18–25 group recorded the highest figure at 5.5 hours, followed by the 26–35 group at 4 hours."], ["s4", "The figure then fell to a low of 2.5 hours for those aged 46–55."]],
        [["s5", "In contrast, people aged 56 and over exercised for 4.5 hours, almost double the previous group."]]
      ],
      steps: [
        { title: "Paraphrase the question", hl: ["s1"], text: "Say what is measured, who, where and when, in your own words. Do not copy the wording of the task." },
        { title: "Write an overview", hl: ["s2"], text: "Give the two or three biggest trends with no numbers. This is the most important paragraph for your score." },
        { title: "Report the key features", hl: ["s3", "s4"], text: "Group related data together and compare figures. Always include units such as hours or percent." },
        { title: "Show contrasts", hl: ["s5"], text: "Use linking words such as in contrast, whereas and by comparison. Describe only what you see, with no opinions or reasons." },
        { title: "Check your answer", hl: "all", text: "Write at least 150 words in the past tense for past dates. Spend about 3 minutes planning, 15 writing and 2 checking." }
      ]
    },
    prompts: [
      { title: "Weekly exercise by age group",
        question: "The chart shows the average number of hours per week that residents of a town in each age group spent exercising in 2024. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.",
        chart: { type: "bar", title: "Hours of exercise per week, 2024", labels: ["18–25", "26–35", "36–45", "46–55", "56+"], series: [{ name: "Hours", values: [5.5, 4, 3, 2.5, 4.5] }], max: 6, step: 2 },
        model: ["The bar chart illustrates how many hours per week residents of one town, divided into five age groups, spent exercising in 2024.",
          "Overall, younger adults exercised the most, while middle-aged residents did the least. Interestingly, activity levels rose again among the oldest group.",
          "People aged 18–25 recorded the highest figure, at 5.5 hours, followed by those aged 26–35, who exercised for 4 hours. The weekly total then fell steadily, reaching 3 hours for the 36–45 group and a low of 2.5 hours for the 46–55 group.",
          "By contrast, the figure climbed sharply to 4.5 hours among residents aged 56 and over, which was almost double the level of the 46–55 group and only 1 hour below that of the youngest group. In total, the gap between the most and least active groups was 3 hours."] },
      { title: "Internet access in two countries",
        question: "The graph shows the percentage of households with internet access in Country A and Country B between 2000 and 2020. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.",
        chart: { type: "line", title: "Households with internet access (%)", labels: ["2000", "2005", "2010", "2015", "2020"], series: [{ name: "Country A", values: [20, 45, 70, 85, 95] }, { name: "Country B", values: [5, 15, 35, 60, 80] }], max: 100, step: 25 },
        model: ["The line graph compares the proportion of households with internet access in Country A and Country B at five-year intervals between 2000 and 2020.",
          "Overall, both countries saw a considerable rise in connectivity, but Country A remained ahead throughout the period, although the gap narrowed towards the end.",
          "In 2000, 20% of households in Country A were online, compared with only 5% in Country B. Country A then grew rapidly, reaching 45% in 2005, 70% in 2010 and 85% in 2015.",
          "Country B started more slowly, climbing to 15% in 2005 and 35% in 2010. However, its growth accelerated after that, with the figure rising to 60% in 2015 and 80% in 2020. Country A ended the period at 95%. As a result, the difference, which peaked at 35 percentage points in 2010, had shrunk to 15 by 2020."] },
      { title: "Travel to school, 2005 and 2025",
        question: "The chart compares the percentage of students using four ways of travelling to school in one city in 2005 and 2025. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.",
        chart: { type: "bar", title: "Students by transport mode (%)", labels: ["Walk", "Bus", "Car", "Bicycle"], series: [{ name: "2005", values: [40, 30, 15, 15] }, { name: "2025", values: [25, 28, 40, 7] }], max: 50, step: 10 },
        model: ["The bar chart compares how students in one city travelled to school in 2005 and 2025, using four modes of transport.",
          "Overall, car travel became by far the most popular option over the twenty years, whereas walking and cycling both lost ground.",
          "In 2005, walking was the leading choice at 40%, followed by the bus at 30%. Cars and bicycles were each used by 15% of students.",
          "By 2025, the picture had changed markedly. The proportion travelling by car rose to 40%, an increase of 25 percentage points, overtaking walking, which fell to 25%. Cycling dropped to just 7%, less than half its earlier level, while bus use remained almost unchanged at 28%, down from 30%. In other words, private transport replaced active travel for a large share of students."] }
    ]
  },
  task2: {
    name: "Task 2", mins: 40, min: 250,
    blurb: "Write an essay giving and supporting your opinion in at least 250 words.",
    lesson: {
      title: "Write an opinion essay",
      example: [
        [["s1", "Some people think that cities should ban private cars from their centres, while others disagree."], ["s2", "In my opinion, a ban is justified, although it must be introduced alongside better public transport."]],
        [["s3", "The first reason is that cars cause pollution and congestion."], ["s4", "Exhaust fumes damage residents’ health, and traffic jams waste time and fuel."], ["s5", "For example, cities that have pedestrianised central streets often report cleaner air and busier local shops."]],
        [["s6", "Critics, however, argue that a ban harms businesses and people with disabilities."], ["s7", "These concerns are valid, but exemptions for taxis and disabled drivers, plus frequent buses and trams, can solve them."]],
        [["s8", "In conclusion, banning cars from city centres brings major health and economic benefits if supported by strong public transport."]]
      ],
      steps: [
        { title: "Introduce and state your position", hl: ["s1", "s2"], text: "Paraphrase the topic, then give a clear opinion. Examiners want your position visible from the first paragraph." },
        { title: "Develop a main idea", hl: ["s3", "s4"], text: "Start the paragraph with one clear reason, then explain it. One paragraph should carry one main idea." },
        { title: "Support with an example", hl: ["s5"], text: "A specific example makes your argument convincing. It can be general knowledge or a realistic situation." },
        { title: "Address the other side", hl: ["s6", "s7"], text: "Show you understand the opposing view, then explain why your position still stands. This shows balance and depth." },
        { title: "Conclude", hl: ["s8"], text: "Restate your position in new words. Do not add new ideas here." },
        { title: "Check and time it", hl: "all", text: "Write at least 250 words. Spend about 5 minutes planning, 30 writing and 5 checking grammar and spelling." }
      ]
    },
    prompts: [
      { title: "Paying for university",
        question: "Some people believe that university education should be free for everyone. Others think students should pay for it. Discuss both views and give your own opinion.",
        model: ["People hold different views on whether higher education should be funded by the state or by students themselves. While free tuition has clear social benefits, I believe a shared-cost system is more sustainable.",
          "Supporters of free university education argue that it creates equal opportunities. When tuition is paid for by the government, talented students from low-income families are not forced to give up their ambitions because of cost. For example, several Nordic countries offer free degrees, and this has helped produce highly skilled workforces and strong social mobility. In addition, graduates generally earn more and pay higher taxes, so society eventually recovers the investment.",
          "On the other hand, those who favour fees point out that universities need substantial funding to maintain quality. If every student is subsidised, public budgets may be stretched, and money could be diverted from schools or hospitals. Moreover, students who contribute financially tend to take their studies more seriously, which can reduce dropout rates. Since graduates personally benefit from higher salaries, it seems reasonable that they should bear part of the cost.",
          "In my opinion, the best solution is a balanced model in which fees are modest and supported by grants and income-based loan repayments. This protects access for disadvantaged students while keeping universities financially stable.",
          "In conclusion, although free education promotes fairness, a shared system offers a more realistic way to maintain both quality and opportunity."] },
      { title: "Working from home",
        question: "Many people now work from home instead of travelling to an office. Do the advantages of this trend outweigh the disadvantages?",
        model: ["Remote working has become increasingly common in recent years. In my view, the advantages outweigh the drawbacks, provided that employers support their staff properly.",
          "The main benefit of working from home is flexibility. Employees save the time and money they would otherwise spend commuting, and many use those hours for family, exercise or rest. For example, a parent can start work earlier and finish in time to collect children from school. As a result, workers often report better wellbeing and higher productivity. Companies also gain, because they can reduce office rental costs and recruit talent from anywhere in the country rather than only from one city. Furthermore, fewer commuters means less traffic and lower carbon emissions, which benefits the wider community.",
          "However, there are genuine disadvantages. Some people feel isolated when they no longer see colleagues daily, and this can harm motivation and teamwork. In addition, the boundary between work and personal life may blur, leading employees to answer messages late into the evening. Younger staff may also miss the informal guidance that they would receive in a shared workplace.",
          "Nevertheless, these problems can be managed. Firms can arrange regular video meetings, occasional office days and clear working hours so that employees stay connected without becoming overworked.",
          "In conclusion, remote work offers significant savings, flexibility and environmental gains. With sensible policies to reduce isolation and overwork, its benefits clearly outweigh its disadvantages."] },
      { title: "Less time with family",
        question: "In many countries, people are spending less time with family members than in the past. What are the causes of this, and what can be done to encourage families to spend more time together?",
        model: ["Family life has changed greatly in many societies, and relatives now often see each other far less than previous generations did. This essay will examine the main causes and suggest some practical solutions.",
          "One major cause is the pressure of modern work. Long hours and demanding careers mean that parents frequently return home exhausted, leaving little energy for shared activities. In addition, many people move to other cities or countries for jobs, so extended families no longer live close together. Technology plays a role as well. Even when relatives are in the same room, they may be absorbed in their phones or tablets rather than talking to one another.",
          "Several measures could help. Employers should be encouraged to offer flexible hours and remote working, which would allow parents to be home for dinner more often. Governments could support this through longer parental leave and by protecting workers from excessive overtime. At the household level, families can set simple rules, such as keeping devices away during meals and reserving one evening a week for a shared activity like cooking or a walk. For example, a family that cooks together once a week builds routine and conversation without any expense. Communities can also organise low-cost events in parks and libraries that welcome all generations.",
          "In conclusion, work pressure, geographical distance and technology are the main reasons families spend less time together. A combination of flexible employment policies and deliberate daily habits could help to rebuild these important bonds."] }
    ]
  }
};

/* ============ STATE (memory only) ============ */
const S = { task: null, idx: 0, step: 0, running: false, started: 0, text: "", used: 0, img: null, auto: false, timer: null };
const $ = (s, r = document) => r.querySelector(s);
const app = $("#app");
const wc = t => (t.trim().match(/\S+/g) || []).length;
const fmt = s => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
const speech = "speechSynthesis" in window;

/* ============ HELPERS ============ */
function stopAll() { clearInterval(S.timer); S.timer = null; S.running = false; if (speech) speechSynthesis.cancel(); }
function show(html) { app.innerHTML = html; app.classList.remove("in"); void app.offsetWidth; app.classList.add("in"); window.scrollTo(0, 0); }

/* Draw a bar or line chart as inline SVG from data */
function chartSVG(c) {
  const W = 360, H = 230, L = 38, R = 10, T = 14, B = 44, pw = W - L - R, ph = H - T - B;
  const n = c.labels.length, gw = pw / n, ns = c.series.length;
  const Y = v => T + ph - (v / c.max) * ph;
  let g = "";
  for (let v = 0; v <= c.max; v += c.step) g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`;
  c.labels.forEach((l, i) => g += `<text x="${L + gw * i + gw / 2}" y="${H - B + 18}" text-anchor="middle">${l}</text>`);
  if (c.type === "bar") {
    const bw = Math.min(30, gw * 0.72 / ns);
    c.series.forEach((s, k) => s.values.forEach((v, i) => {
      const x = L + gw * i + gw / 2 - bw * ns / 2 + bw * k;
      g += `<rect class="s${k}" x="${x}" y="${Y(v)}" width="${bw - 2}" height="${T + ph - Y(v)}" rx="3"/>`;
    }));
  } else {
    c.series.forEach((s, k) => {
      const pts = s.values.map((v, i) => [L + gw * i + gw / 2, Y(v)]);
      g += `<polyline class="ln s${k}" points="${pts.map(p => p.join(",")).join(" ")}"/>` + pts.map(p => `<circle class="s${k}" cx="${p[0]}" cy="${p[1]}" r="4"/>`).join("");
    });
  }
  const leg = ns > 1 ? `<div class="leg">${c.series.map((s, k) => `<span><i class="s${k}"></i>${s.name}</span>`).join("")}</div>` : "";
  return `<figure class="chart"><div class="cap">${c.title}</div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${c.title}">${g}</svg>${leg}</figure>`;
}

/* ============ SCREENS ============ */
function home() {
  stopAll();
  show(`<h1>Writing</h1><p class="lead">Learn the structure, then practise under real exam timing.</p><div class="grid">` +
    Object.entries(DATA).map(([k, t]) => `<article class="card"><h2>${t.name}</h2>
      <p class="meta"><span>${t.mins} minutes</span><span>Minimum ${t.min} words</span></p><p>${t.blurb}</p>
      <div class="row"><button class="btn ghost" data-act="learn" data-k="${k}">Learn</button><button class="btn" data-act="practice" data-k="${k}">Practice</button></div></article>`).join("") + `</div>`);
}

function lesson(k) {
  stopAll(); S.task = k; S.step = 0;
  const L = DATA[k].lesson;
  show(`<button class="back" data-act="home">← Home</button><h1>${DATA[k].name}: ${L.title}</h1>
    <div class="bar" role="progressbar"><i id="bar"></i></div><p class="count" id="cnt"></p>
    <div class="ex" id="ex">${L.example.map(p => `<p>${p.map(([id, t]) => `<span class="seg" data-id="${id}">${t}</span>`).join(" ")}</p>`).join("")}</div>
    <section class="note" id="note" aria-live="polite"></section>
    <div class="row"><button class="btn ghost" data-act="prev">Back</button><button class="btn ghost" id="lis" data-act="listen">Listen</button><button class="btn" id="nxt" data-act="next">Next</button></div>`);
  if (!speech) { $("#lis").disabled = true; $("#lis").title = "Speech is not supported in this browser"; }
  paintStep();
}

function paintStep() {
  const L = DATA[S.task].lesson, st = L.steps[S.step], n = L.steps.length;
  if (speech) speechSynthesis.cancel();
  $("#lis") && ($("#lis").textContent = "Listen");
  $("#bar").style.width = ((S.step + 1) / n * 100) + "%";
  $("#cnt").textContent = `Step ${S.step + 1} of ${n}`;
  document.querySelectorAll(".seg").forEach(e => e.classList.toggle("on", st.hl === "all" || st.hl.includes(e.dataset.id)));
  $("#ex").classList.toggle("focus", st.hl !== "all");
  const note = $("#note");
  note.innerHTML = `<h3>${st.title}</h3><p>${st.text}</p>`;
  note.style.animation = "none"; void note.offsetWidth; note.style.animation = "";
  $("#nxt").textContent = S.step === n - 1 ? "Practise now" : "Next";
  const first = $(".seg.on"); if (first) first.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

/* Read the current lesson step aloud (browser SpeechSynthesis) */
function listen() {
  if (!speech) return;
  const b = $("#lis");
  if (speechSynthesis.speaking) { speechSynthesis.cancel(); b.textContent = "Listen"; return; }
  const st = DATA[S.task].lesson.steps[S.step];
  const u = new SpeechSynthesisUtterance(st.title + ". " + st.text);
  u.lang = "en-GB"; u.rate = 0.95;
  u.onend = u.onerror = () => { b.textContent = "Listen"; };
  b.textContent = "Stop";
  speechSynthesis.speak(u);
}

function practice(k, i = 0) {
  stopAll(); Object.assign(S, { task: k, idx: i, text: "", img: null, used: 0, auto: false });
  const t = DATA[k], p = t.prompts[i];
  show(`<button class="back" data-act="home">← Home</button><h1>${t.name} practice</h1>
    <div class="chips" role="group" aria-label="Choose a task">${t.prompts.map((q, j) => `<button class="chip ${j === i ? "on" : ""}" data-act="pick" data-i="${j}" aria-label="Prompt ${j + 1}">${j + 1}</button>`).join("")}</div>
    <section class="card"><h2>${p.title}</h2><p>${p.question}</p>${p.chart ? chartSVG(p.chart) : ""}</section>
    <div class="timer"><span id="clock">${fmt(t.mins * 60)}</span><span id="warn" role="status" hidden>5 minutes left</span></div>
    <textarea id="ta" disabled placeholder="Press Start to begin the timer, then type your answer here." aria-label="Your answer"></textarea>
    <div class="row split"><span class="count" id="wcnt">0 words · minimum ${t.min}</span><button class="btn" id="go" data-act="start">Start timer</button></div>
    <details class="card"><summary>Or upload a handwritten answer</summary>
      <label class="drop"><input type="file" id="file" accept="image/*" capture="environment"></label>
      <img class="pv" id="pv" alt="Preview of your handwritten answer" hidden></details>
    <button class="btn" id="sub" data-act="submit" disabled>Submit answer</button>`);
}

function start() {
  const total = DATA[S.task].mins * 60;
  S.running = true; S.started = Date.now();
  $("#ta").disabled = false; $("#ta").focus();
  $("#go").hidden = true; $("#sub").disabled = false;
  document.querySelectorAll(".chip").forEach(c => c.disabled = true);
  S.timer = setInterval(() => {
    const left = Math.max(0, total - Math.floor((Date.now() - S.started) / 1000));
    $("#clock").textContent = fmt(left);
    const low = left <= 300;
    $("#clock").classList.toggle("warn", low); $("#warn").hidden = !low;
    if (left === 0) submit(true);
  }, 250);
}

function submit(auto) {
  const total = DATA[S.task].mins * 60;
  S.used = S.running ? Math.min(total, Math.floor((Date.now() - S.started) / 1000)) : 0;
  S.text = $("#ta").value; S.auto = auto === true;
  result();
}

function result() {
  stopAll();
  const t = DATA[S.task], m = t.prompts[S.idx].model, n = wc(S.text);
  show(`<h1>Your result</h1>
    ${S.auto ? `<p class="banner">Time is up, so your answer was submitted automatically.</p>` : ""}
    <div class="stats"><div><b>${n}</b><span>words</span></div><div><b>${fmt(S.used)}</b><span>time used</span></div><div><b>${n >= t.min ? "Met" : "Short"}</b><span>minimum ${t.min}</span></div></div>
    ${S.img ? `<img class="pv" src="${S.img}" alt="Your handwritten answer">` : ""}
    <section class="card"><h2>AI feedback</h2><p class="mute">Coming soon: band-score feedback on Task Response, Coherence, Vocabulary and Grammar.</p><div class="skel"><i></i><i></i><i></i></div></section>
    <section class="card"><h2>Compare with model answer</h2>
      <button class="btn ghost" data-act="compare" id="cb">Show model answer</button>
      <div class="cmp" id="cmp" hidden><div><h3>Your answer</h3><div id="mine"></div></div><div><h3>Model answer · ${wc(m.join(" "))} words</h3><div>${m.map(p => `<p>${p}</p>`).join("")}</div></div></div></section>
    <div class="row"><button class="btn" data-act="retry">Try again</button><button class="btn ghost" data-act="home">Home</button></div>`);
  $("#mine").textContent = S.text.trim() || (S.img ? "(Handwritten answer uploaded)" : "(No text written)");
}

/* ============ EVENTS ============ */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, L = S.task && DATA[S.task].lesson;
  if (a === "home") home();
  else if (a === "learn") lesson(b.dataset.k);
  else if (a === "practice") practice(b.dataset.k);
  else if (a === "pick") practice(S.task, +b.dataset.i);
  else if (a === "prev") { if (S.step > 0) { S.step--; paintStep(); } }
  else if (a === "next") { if (S.step < L.steps.length - 1) { S.step++; paintStep(); } else practice(S.task); }
  else if (a === "listen") listen();
  else if (a === "start") start();
  else if (a === "submit") submit(false);
  else if (a === "retry") practice(S.task, S.idx);
  else if (a === "compare") { const c = $("#cmp"); c.hidden = !c.hidden; b.textContent = c.hidden ? "Show model answer" : "Hide model answer"; }
});

document.addEventListener("input", e => {
  if (e.target.id === "ta") $("#wcnt").textContent = `${wc(e.target.value)} words · minimum ${DATA[S.task].min}`;
});

/* Handwritten upload: preview only (no upload yet) */
document.addEventListener("change", e => {
  if (e.target.id !== "file" || !e.target.files[0]) return;
  if (S.img) URL.revokeObjectURL(S.img);
  S.img = URL.createObjectURL(e.target.files[0]);
  $("#pv").src = S.img; $("#pv").hidden = false; $("#sub").disabled = false;
});

$("#theme").addEventListener("click", () => {
  const el = document.documentElement;
  const cur = el.dataset.theme || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light");
  el.dataset.theme = cur === "dark" ? "light" : "dark";
});

home();
</script>
</body>
</html>
